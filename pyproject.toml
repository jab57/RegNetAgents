[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regnetagents"
version = "1.2.7"
description = "A multi-agent LLM system for gene regulatory network analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Jose A. Bird", email = "jbird@birdaisolutions.com"}
]
maintainers = [
    {name = "Jose A. Bird", email = "jbird@birdaisolutions.com"}
]
keywords = [
    "gene-regulatory-networks",
    "multi-agent-systems",
    "llm",
    "bioinformatics",
    "langgraph",
    "aracne",
    "network-analysis",
    "systems-biology",
    "workflow-automation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "langgraph==1.0.7",
    "mcp==1.25.0",
    "networkx==3.6.1",
    "pandas==3.0.0",
    "numpy==2.4.1",
    "requests==2.32.5",
    "python-dotenv==1.2.1",
    "scipy==1.17.1",
]

[project.optional-dependencies]
llm = [
    "ollama==0.6.1",
]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "black==24.4.2",
    "ruff==0.11.11",
]
scripts = [
    "python-pptx==1.0.2",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
]
docs = [
    "sphinx==7.3.7",
    "sphinx-rtd-theme==3.1.0",
]

[project.urls]
Homepage = "https://github.com/jab57/RegNetAgents"
Documentation = "https://github.com/jab57/RegNetAgents#readme"
Repository = "https://github.com/jab57/RegNetAgents.git"
Issues = "https://github.com/jab57/RegNetAgents/issues"

[project.scripts]
regnetagents-server = "regnetagents_langgraph_mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["regnetagents*"]

[tool.setuptools.package-data]
regnetagents = ["models/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | __pycache__
    | build
    | dist
    | gremln_source
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "gremln_source",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
