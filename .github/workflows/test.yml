name: Tests

on:
  push:
    branches:
      - main
    paths:
      - '*.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test Suite

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify installation
        run: python verify_installation.py

      - name: Run workflow tests (rule-based mode)
        env:
          USE_LLM_AGENTS: 'false'
        run: |
          python -c "
          import asyncio
          from regnetagents_langgraph_workflow import RegNetAgentsWorkflow

          async def test():
              workflow = RegNetAgentsWorkflow()
              result = await workflow.run_analysis(
                  gene='TP53',
                  cell_type='epithelial_cell',
                  analysis_depth='comprehensive'
              )
              assert result is not None
              assert 'gene_info' in result or 'error' not in result
              print('Workflow test PASSED')

          asyncio.run(test())
          "

      - name: Run MCP server tests (rule-based mode)
        env:
          USE_LLM_AGENTS: 'false'
        run: |
          python -c "
          import asyncio
          import sys
          sys.path.insert(0, '.')

          async def test():
              from regnetagents_langgraph_mcp_server import handle_call_tool, get_workflow

              # Initialize workflow
              workflow = await get_workflow()
              print('MCP server initialized')

              # Test comprehensive_gene_analysis tool
              result = await handle_call_tool('comprehensive_gene_analysis', {
                  'gene': 'TP53',
                  'cell_type': 'epithelial_cell',
                  'analysis_depth': 'focused'
              })

              assert result is not None
              assert len(result) > 0
              print('MCP server test PASSED')

          asyncio.run(test())
          "

      - name: Run validate_gene tests (rule-based mode)
        env:
          USE_LLM_AGENTS: 'false'
        run: |
          python -c "
          import asyncio
          import sys
          sys.path.insert(0, '.')

          async def test():
              from regnetagents_langgraph_mcp_server import get_workflow

              workflow = await get_workflow()
              agent = workflow.modeling_agent

              # Test valid gene
              result = agent.validate_gene('TP53', 'epithelial_cell')
              assert result['found'] is True, f'Expected found=True, got {result}'
              assert 'quick_stats' in result, f'Expected quick_stats in result'
              print(f'validate_gene(TP53): found={result[\"found\"]}, role={result[\"quick_stats\"][\"regulatory_role\"]}')

              # Test invalid gene
              result = agent.validate_gene('FAKEGENE', 'epithelial_cell')
              assert result['found'] is False, f'Expected found=False, got {result}'
              print(f'validate_gene(FAKEGENE): found={result[\"found\"]}')

              # Test case insensitivity
              r1 = agent.validate_gene('tp53', 'epithelial_cell')
              r2 = agent.validate_gene('TP53', 'epithelial_cell')
              assert r1['found'] == r2['found'], 'Case insensitivity failed'
              print('validate_gene case insensitivity: PASSED')

              print('validate_gene tests PASSED')

          asyncio.run(test())
          "

      - name: Run query_network tests (rule-based mode)
        env:
          USE_LLM_AGENTS: 'false'
        run: |
          python -c "
          import asyncio
          import sys
          sys.path.insert(0, '.')

          async def test():
              from regnetagents_langgraph_mcp_server import get_workflow

              workflow = await get_workflow()
              agent = workflow.modeling_agent

              # Test top_regulators
              result = agent.query_network('top_regulators', 'epithelial_cell', top_n=5)
              assert 'results' in result, f'Expected results key, got {result}'
              assert len(result['results']) == 5, f'Expected 5 results, got {len(result[\"results\"])}'
              counts = [r['num_targets'] for r in result['results']]
              assert counts == sorted(counts, reverse=True), 'Results not sorted by num_targets'
              print(f'top_regulators: top={result[\"results\"][0][\"gene\"]} ({counts[0]} targets)')

              # Test top_targets
              result = agent.query_network('top_targets', 'epithelial_cell', top_n=5)
              assert 'results' in result, f'Expected results key, got {result}'
              assert len(result['results']) == 5, f'Expected 5 results, got {len(result[\"results\"])}'
              print(f'top_targets: top={result[\"results\"][0][\"gene\"]} ({result[\"results\"][0][\"num_regulators\"]} regulators)')

              # Test gene_neighbors
              result = agent.query_network('gene_neighbors', 'epithelial_cell', gene='TP53')
              assert 'regulators' in result and 'targets' in result, f'Expected regulators/targets, got {result}'
              print(f'gene_neighbors(TP53): {result[\"num_regulators\"]} regulators, {result[\"num_targets\"]} targets')

              # Test gene_neighbors with invalid gene
              result = agent.query_network('gene_neighbors', 'epithelial_cell', gene='FAKEGENE')
              assert result.get('error') is True, f'Expected error=True, got {result}'
              print(f'gene_neighbors(FAKEGENE): error={result[\"error\"]}')

              # Test network_stats
              result = agent.query_network('network_stats', 'epithelial_cell')
              assert 'num_genes' in result and 'num_edges' in result and 'density' in result
              print(f'network_stats: {result[\"num_genes\"]} genes, {result[\"num_edges\"]} edges, density={result[\"density\"]}')

              print('query_network tests PASSED')

          asyncio.run(test())
          "

      - name: Run MCP Resources tests (rule-based mode)
        env:
          USE_LLM_AGENTS: 'false'
        run: |
          python -c "
          import asyncio, json, sys
          sys.path.insert(0, '.')

          async def test():
              from pydantic import AnyUrl
              from regnetagents_langgraph_mcp_server import handle_list_resources, handle_read_resource

              # list_resources returns 1 static + 10 network resources
              resources = await handle_list_resources()
              assert len(resources) == 11, f'Expected 11 resources, got {len(resources)}'
              print(f'handle_list_resources: {len(resources)} resources')

              # read cell-types resource returns 10 cell types
              contents = await handle_read_resource(AnyUrl('regnetagents://cell-types'))
              data = json.loads(contents[0].content)
              assert len(data['cell_types']) == 10, f'Expected 10 cell types, got {len(data[\"cell_types\"])}'
              print(f'cell-types resource: {len(data[\"cell_types\"])} cell types')

              # read network resource returns expected fields
              contents = await handle_read_resource(AnyUrl('regnetagents://network/epithelial_cell'))
              data = json.loads(contents[0].content)
              assert 'num_genes' in data and 'num_edges' in data and 'top_regulators_by_pagerank' in data
              print(f'network resource: {data[\"num_genes\"]} genes, {data[\"num_edges\"]} edges')

              # read gene resource returns found=True for TP53
              contents = await handle_read_resource(AnyUrl('regnetagents://gene/TP53'))
              data = json.loads(contents[0].content)
              assert data['found'] is True, f'Expected found=True, got {data}'
              print(f'gene resource: found={data[\"found\"]}, present_in={data[\"present_in_cell_types\"]} cell types')

              print('MCP Resources tests PASSED')

          asyncio.run(test())
          "

      - name: Run timing tests (rule-based mode)
        env:
          USE_LLM_AGENTS: 'false'
        run: |
          python -c "
          import asyncio
          import sys
          sys.path.insert(0, 'tests')

          from test_timing import (
              test_single_gene_focused_rules,
              test_single_gene_comprehensive_rules
          )

          async def run_tests():
              t1 = await test_single_gene_focused_rules()
              t2 = await test_single_gene_comprehensive_rules()
              print(f'Timing tests PASSED (focused: {t1:.2f}s, comprehensive: {t2:.2f}s)')

          asyncio.run(run_tests())
          "
