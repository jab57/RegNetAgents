name: Tests

on:
  push:
    branches:
      - main
    paths:
      - '*.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test Suite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Verify installation
        run: python verify_installation.py

      - name: Run tests (rule-based mode, no Ollama required)
        env:
          USE_LLM_AGENTS: 'false'
        run: |
          pytest tests/ --ignore=tests/test_ollama_agents.py -v \
            --cov=regnetagents_langgraph_mcp_server \
            --cov=regnetagents_langgraph_workflow \
            --cov-report=term-missing
