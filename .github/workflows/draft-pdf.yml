name: Draft PDF
on:
  push:
    branches:
      - main
    paths:
      - 'paper.md'
      - 'paper.bib'
      - 'fig*.png'
      - '.github/workflows/draft-pdf.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-24.04
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper.md
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: paper
          path: paper.pdf
