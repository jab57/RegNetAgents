name: Draft PDF
on:
  push:
    branches:
      - main
    paths:
      - 'paper.md'
      - 'paper.bib'
      - 'figure*.png'
      - '.github/workflows/draft-pdf.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-fonts-extra

      - name: Download JOSS template
        run: |
          curl -o joss-template.latex https://raw.githubusercontent.com/openjournals/joss/main/app/assets/papers/joss/latex.template

      - name: Build PDF without line numbers
        run: |
          pandoc paper.md \
            --pdf-engine=xelatex \
            --template=joss-template.latex \
            --citeproc \
            --bibliography=paper.bib \
            -V linenumbers=false \
            -V journal_name="Journal of Open Source Software" \
            -o paper.pdf

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper.pdf
